<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450">
  <rect width="1200" height="450" fill="#0d1117"/>
  <rect width="1200" height="48" fill="#161b22"/>
  <circle cx="28" cy="24" r="7" fill="#ff5f57"/><circle cx="52" cy="24" r="7" fill="#febc2e"/><circle cx="76" cy="24" r="7" fill="#28c840"/>
  <text x="600" y="30" fill="#c9d1d9" font-family="Menlo, monospace" font-size="17" text-anchor="middle">Docker Desktop host-network Apache verification</text>
  <g font-family="Menlo, monospace" font-size="19">
    <text x="36" y="92" fill="#7ee787">$ docker pull httpd:2.4-alpine</text>
    <text x="36" y="126" fill="#c9d1d9">Status: Image is up to date for httpd:2.4-alpine</text>
    <text x="36" y="184" fill="#7ee787">$ docker run -d --name networking-apache2-host --network host httpd:2.4-alpine</text>
    <text x="36" y="218" fill="#c9d1d9">&lt;container-id&gt;</text>
    <text x="36" y="276" fill="#7ee787">$ curl --fail --silent http://127.0.0.1:80/</text>
    <text x="36" y="310" fill="#c9d1d9">&lt;title&gt;It works! Apache httpd&lt;/title&gt;</text>
    <text x="36" y="342" fill="#c9d1d9">&lt;p&gt;It works!&lt;/p&gt;</text>
  </g>
</svg>
