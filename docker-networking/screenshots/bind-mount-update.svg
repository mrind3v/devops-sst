<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" fill="#0d1117"/>
  <rect width="1200" height="48" fill="#161b22"/>
  <circle cx="28" cy="24" r="7" fill="#ff5f57"/><circle cx="52" cy="24" r="7" fill="#febc2e"/><circle cx="76" cy="24" r="7" fill="#28c840"/>
  <text x="600" y="30" fill="#c9d1d9" font-family="Menlo, monospace" font-size="17" text-anchor="middle">Docker bind mount verification</text>
  <g font-family="Menlo, monospace" font-size="18">
    <text x="36" y="92" fill="#7ee787">$ mkdir bind-mount-site</text>
    <text x="36" y="132" fill="#7ee787">$ echo '&lt;h1&gt;Hello students&lt;/h1&gt;' &gt; bind-mount-site/index.html</text>
    <text x="36" y="188" fill="#7ee787">$ docker run -d --name networking-bind-mount -p 8090:80 \</text>
    <text x="36" y="220" fill="#7ee787">  -v "$PWD/bind-mount-site:/usr/share/nginx/html:ro" nginx:alpine</text>
    <text x="36" y="276" fill="#7ee787">$ curl --silent http://127.0.0.1:8090/</text>
    <text x="36" y="308" fill="#c9d1d9">&lt;h1&gt;Hello students&lt;/h1&gt;</text>
    <text x="36" y="364" fill="#7ee787">$ echo '&lt;h1&gt;Hello students - updated&lt;/h1&gt;' &gt; bind-mount-site/index.html</text>
    <text x="36" y="420" fill="#7ee787">$ curl --silent http://127.0.0.1:8090/</text>
    <text x="36" y="452" fill="#c9d1d9">&lt;h1&gt;Hello students - updated&lt;/h1&gt;</text>
  </g>
</svg>
