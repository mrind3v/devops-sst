<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650">
  <rect width="1440" height="650" fill="#10151f"/><rect width="1440" height="54" fill="#252d3b"/>
  <circle cx="28" cy="27" r="10" fill="#ff5f57"/><circle cx="58" cy="27" r="10" fill="#febc2e"/><circle cx="88" cy="27" r="10" fill="#28c840"/>
  <text x="720" y="34" text-anchor="middle" fill="#d9e1ee" font-family="Menlo, monospace" font-size="18">Ubuntu 24.04 — Docker terminal</text>
  <g font-family="Menlo, Consolas, monospace" font-size="20" fill="#d9e1ee">
    <text x="36" y="100" fill="#8be9fd">root@ubuntu:/# command -v adduser; command -v useradd</text>
    <text x="36" y="136">/usr/sbin/adduser</text><text x="36" y="168">/usr/sbin/useradd</text>
    <text x="36" y="220" fill="#8be9fd">root@ubuntu:/# adduser --disabled-password --gecos "" testuser</text>
    <text x="36" y="256">Adding user `testuser' ...</text><text x="36" y="288">Creating home directory `/home/testuser' ...</text>
    <text x="36" y="340" fill="#8be9fd">root@ubuntu:/# id testuser</text>
    <text x="36" y="376">uid=1001(testuser) gid=1001(testuser) groups=1001(testuser),100(users)</text>
    <text x="36" y="428" fill="#8be9fd">root@ubuntu:/# getent passwd testuser</text>
    <text x="36" y="464">testuser:x:1001:1001:,,,:/home/testuser:/bin/bash</text>
    <text x="36" y="516" fill="#8be9fd">root@ubuntu:/# userdel -r testuser</text>
    <text x="36" y="552" fill="#50fa7b">test user removed; the temporary container is discarded after the demo</text>
  </g>
</svg>
