<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580" role="img" aria-label="Browser views showing Hello World pages for Apache and Nginx Docker containers">
  <rect width="1600" height="580" fill="#f3f4f6"/>
  <text x="70" y="72" fill="#111827" font-family="Arial, sans-serif" font-size="34" font-weight="700">Docker Hello World: Web Servers</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 120)">
      <rect width="700" height="340" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
      <rect width="700" height="52" rx="12" fill="#e5e7eb"/><circle cx="28" cy="26" r="8" fill="#ef4444"/><circle cx="52" cy="26" r="8" fill="#f59e0b"/><circle cx="76" cy="26" r="8" fill="#22c55e"/>
      <text x="110" y="33" fill="#374151" font-size="20">127.0.0.1:8084</text><text x="40" y="145" fill="#111827" font-size="34" font-weight="700">Hello World from Apache</text><text x="40" y="200" fill="#6b7280" font-size="22">Image: docker-homework-apache</text>
    </g>
    <g transform="translate(830 120)">
      <rect width="700" height="340" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
      <rect width="700" height="52" rx="12" fill="#e5e7eb"/><circle cx="28" cy="26" r="8" fill="#ef4444"/><circle cx="52" cy="26" r="8" fill="#f59e0b"/><circle cx="76" cy="26" r="8" fill="#22c55e"/>
      <text x="110" y="33" fill="#374151" font-size="20">127.0.0.1:8086</text><text x="40" y="145" fill="#111827" font-size="34" font-weight="700">Hello World from Nginx</text><text x="40" y="200" fill="#6b7280" font-size="22">Image: docker-homework-nginx</text>
    </g>
  </g>
</svg>
