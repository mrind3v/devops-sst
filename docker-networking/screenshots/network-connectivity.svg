<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#0d1117"/>
  <rect width="1200" height="48" fill="#161b22"/>
  <circle cx="28" cy="24" r="7" fill="#ff5f57"/><circle cx="52" cy="24" r="7" fill="#febc2e"/><circle cx="76" cy="24" r="7" fill="#28c840"/>
  <text x="600" y="30" fill="#c9d1d9" font-family="Menlo, monospace" font-size="17" text-anchor="middle">Docker networking verification</text>
  <g font-family="Menlo, monospace" font-size="19">
    <text x="36" y="91" fill="#7ee787">$ docker network create networking-frontend-net</text>
    <text x="36" y="123" fill="#7ee787">$ docker network create networking-backend-net</text>
    <text x="36" y="155" fill="#7ee787">$ docker network create networking-database-net</text>
    <text x="36" y="211" fill="#7ee787">$ docker run -d --name networking-frontend --network networking-frontend-net nginx:alpine</text>
    <text x="36" y="243" fill="#7ee787">$ docker run -d --name networking-backend --network networking-backend-net nginx:alpine</text>
    <text x="36" y="275" fill="#7ee787">$ docker network connect --alias backend networking-frontend-net networking-backend</text>
    <text x="36" y="307" fill="#7ee787">$ docker run -d --name networking-database --network networking-backend-net -e MYSQL_ROOT_PASSWORD=networking-demo-root mysql:8.4</text>
    <text x="36" y="339" fill="#7ee787">$ docker network connect networking-database-net networking-database</text>
    <text x="36" y="395" fill="#7ee787">$ docker exec networking-frontend wget -qO- http://backend/ | head -1</text>
    <text x="36" y="429" fill="#c9d1d9">&lt;!DOCTYPE html&gt;</text>
    <text x="36" y="485" fill="#7ee787">$ docker exec networking-backend sh -c 'nc -zvw 3 database 3306'</text>
    <text x="36" y="519" fill="#c9d1d9">database (172.19.0.3:3306) open</text>
  </g>
</svg>
