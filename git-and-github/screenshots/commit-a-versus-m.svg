<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Terminal comparing git commit m and git commit a m">
  <rect width="1600" height="900" fill="#1e1e1e"/>
  <rect width="1600" height="58" fill="#303030"/>
  <circle cx="30" cy="29" r="10" fill="#ff5f57"/><circle cx="62" cy="29" r="10" fill="#ffbd2e"/><circle cx="94" cy="29" r="10" fill="#28c840"/>
  <text x="800" y="37" fill="#d4d4d4" font-family="Menlo, Consolas, monospace" font-size="20" text-anchor="middle">Ubuntu — bash</text>
  <g font-family="Menlo, Consolas, monospace" font-size="24" xml:space="preserve">
    <text x="42" y="108" fill="#8be9fd">student@ubuntu</text><text x="260" y="108" fill="#f8f8f2">:~/git-commit-lab$ git add tracked.txt</text>
    <text x="42" y="149" fill="#8be9fd">student@ubuntu</text><text x="260" y="149" fill="#f8f8f2">:~/git-commit-lab$ git commit -m "Commit staged change"</text>
    <text x="42" y="190" fill="#f8f8f2">[main 74ecfff] Commit staged change</text>
    <text x="42" y="231" fill="#f8f8f2"> 1 file changed, 1 insertion(+)</text>
    <text x="42" y="297" fill="#f8f8f2"># Modify tracked.txt, then create untracked.txt</text>
    <text x="42" y="363" fill="#8be9fd">student@ubuntu</text><text x="260" y="363" fill="#f8f8f2">:~/git-commit-lab$ git commit -a -m "Commit tracked change with -a"</text>
    <text x="42" y="404" fill="#f8f8f2">[main d40817a] Commit tracked change with -a</text>
    <text x="42" y="445" fill="#f8f8f2"> 1 file changed, 1 insertion(+)</text>
    <text x="42" y="511" fill="#8be9fd">student@ubuntu</text><text x="260" y="511" fill="#f8f8f2">:~/git-commit-lab$ git status --short</text>
    <text x="42" y="552" fill="#ffb86c">?? untracked.txt</text>
    <text x="42" y="618" fill="#8be9fd">student@ubuntu</text><text x="260" y="618" fill="#f8f8f2">:~/git-commit-lab$ git log --oneline -3</text>
    <text x="42" y="659" fill="#f8f8f2">d40817a Commit tracked change with -a</text>
    <text x="42" y="700" fill="#f8f8f2">74ecfff Commit staged change</text>
    <text x="42" y="741" fill="#f8f8f2">612e579 Initial tracked file</text>
  </g>
</svg>
